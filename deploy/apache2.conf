# Template for the separate Apache webserver container.
# Replace panel.example.com, MINECRAFT_CONTAINER_IP and certificate paths.
# Required modules: proxy proxy_http headers ssl
<VirtualHost *:80>
    ServerName panel.example.com
    Redirect permanent / https://panel.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName panel.example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/panel.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/panel.example.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    # Discard client-supplied forwarding data; mod_proxy adds the actual client address.
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://MINECRAFT_CONTAINER_IP:8080/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://MINECRAFT_CONTAINER_IP:8080/
    LimitRequestBody 537919488

    ErrorLog ${APACHE_LOG_DIR}/minedock-error.log
    CustomLog ${APACHE_LOG_DIR}/minedock-access.log combined
</VirtualHost>
